<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація на онлайн-курс</title>
</head>
<body>
  <header>
    <h1>Реєстрація на онлайн-курс</h1>
  </header>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Особисті дані</legend>

        <p>
          <label for="first-name">Ім'я:</label>
          <input type="text" id="first-name" name="first_name" required>
        </p>
        <p>
          <label for="last-name">Прізвище:</label>
          <input type="text" id="last-name" name="last_name" required>
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="age">Вік (від 16 до 80):</label>
          <input type="number" id="age" name="age" min="16" max="80">
        </p>
      </fieldset>

      <fieldset>
        <legend>Навчання</legend>

        <p>
          <label for="course">Напрям навчання:</label>
          <select id="course" name="course" required>
            <option value="">— оберіть напрям —</option>
            <option value="web">Веброзробка</option>
            <option value="vibe">Vibe Coding</option>
            <option value="data">Аналіз даних</option>
          </select>
        </p>

        <p>Формат навчання:</p>
        <p>
          <input type="radio" id="format-online" name="format" value="online" checked>
          <label for="format-online">Онлайн</label>
          <input type="radio" id="format-offline" name="format" value="offline">
          <label for="format-offline">Офлайн</label>
        </p>

        <p>Додаткові інтереси:</p>
        <p>
          <input type="checkbox" id="int-ai" name="interests" value="ai">
          <label for="int-ai">Штучний інтелект</label>
          <input type="checkbox" id="int-design" name="interests" value="design">
          <label for="int-design">Дизайн</label>
          <input type="checkbox" id="int-business" name="interests" value="business">
          <label for="int-business">Автоматизація бізнесу</label>
        </p>

        <p>
          <label for="comment">Коментар:</label><br>
          <textarea id="comment" name="comment" rows="4" cols="40"></textarea>
        </p>
      </fieldset>

      <button type="submit">Зареєструватися</button>
    </form>
  </main>

  <footer>
    <p>Дані нікуди не надсилаються — це навчальна сторінка.</p>
  </footer>
</body>
</html>
